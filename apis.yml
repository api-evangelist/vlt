apis:
- aid: vlt:vlt-serverless-registry-api
  name: vlt Serverless Registry (vsr) API
  description: npm-compatible package registry API implemented by vsr, vlt's serverless
    registry. Exposes package publish/install endpoints (packuments, tarballs, dist-tags),
    user and token management, granular access control, search, audit, and ping routes.
    The hosted platform instance at registry.vlt.io is authentication-gated; self-hosted
    vsr instances serve their own OpenAPI document at /-/api and an interactive API
    reference at /-/docs.
  baseURL: https://registry.vlt.io
  humanURL: https://github.com/vltpkg/vsr
