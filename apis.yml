aid: vlt
name: vlt
description: vlt (pronounced "volt") is a JavaScript package management company started
  by the creator of npm and former members of the npm core team, and backed by Accel.
  It ships the open source vlt package manager CLI, the npm-compatible vlt serverless
  registry (vsr) that runs on Cloudflare's edge network, and a hosted registry platform
  at vlt.io with user, token, and access management exposed through an npm-compatible
  registry API at registry.vlt.io.
